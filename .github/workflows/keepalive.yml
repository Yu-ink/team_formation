# 외부 예약 서비스(GitHub Actions)로 매일 DB에 질의해 Supabase 무료 프로젝트가 일시정지되지 않게 한다.
name: DB keepalive
on:
  schedule:
    - cron: "17 0,12 * * *"   # 매일 09:17, 21:17 (한국 시간)
  workflow_dispatch: {}        # Actions 탭에서 손으로도 실행 가능
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.2"
      - run: python scripts/keepalive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
